[workspace]
resolver = "3"

[workspace.dependencies]
aist-core = { git = "https://github.com/DenisGorbachev/aist", rev = "b2fd3e26b40a4a4a7841aa0a709e7e0cbcfeb75b" }
aist-codex = { git = "https://github.com/DenisGorbachev/aist", rev = "b2fd3e26b40a4a4a7841aa0a709e7e0cbcfeb75b" }
clap = { version = "4.6.6", features = ["derive", "env"] }
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
futures = "0.3.34"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "spec"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.99"
description = "External specification checks for Baselang"

[package.metadata.details]
title = ""
readme.generate = false

[dependencies]
aist-core.workspace = true
# TODO: Review aist-codex before enabling its feature and running LLM checks.
aist-codex = { workspace = true, optional = true }
clap.workspace = true
errgonomic.workspace = true
futures.workspace = true
thiserror.workspace = true
tokio.workspace = true

[lints]
workspace = true
