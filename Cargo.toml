[workspace]
members = ["aist", "spec"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
repository = "https://github.com/DenisGorbachev/baselang"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "deno.lock",
    "deno.json",
    "clippy.toml",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "shuck.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "skills-lock.json",
    ".yolobox"
]

[workspace.metadata.details]
name = "baselang"
title = "Baselang"
readme = { }

[workspace.dependencies]
aist = { path = "aist" }
clap = { version = "4.5.11", features = ["derive"] }
derive-new = "0.7.0"
derive_getters = { package = "derive-getters", version = "0.5.0", features = ["auto_copy_getters"] }
derive_more = "2.1.1"
errgonomic = { git = "https://github.com/DenisGorbachev/errgonomic" }
facet = { version = "0.44.3", features = ["reflect"] }
facet-pretty = "0.44.4"
futures = "0.3.32"
itertools = "0.15.0"
non-empty-str = "0.13.0"
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
rustc-hash = "2.1.2"
smallvec = "1.15.1"
#standard-traits = { git = "https://github.com/DenisGorbachev/standard-traits" }
strum = { version = "0.28.0", features = ["derive"] }
stub-macro = "0.3.0"
stub_macro_0_2 = { package = "stub-macro", version = "0.2.1" }
#subtype = { git = "https://github.com/DenisGorbachev/subtype" }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = "1.50.0"

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "baselang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Baselang is a language for describing how things work."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = "Baselang"

[lints]
workspace = true

[dependencies]
clap.workspace = true
derive-new.workspace = true
derive_getters.workspace = true
derive_more = { workspace = true, features = ["full"] }
errgonomic.workspace = true
itertools.workspace = true
non-empty-str.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "fs", "net", "rt", "rt-multi-thread"] }

[dev-dependencies]
pretty_assertions.workspace = true
